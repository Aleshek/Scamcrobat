# Checks that the project builds (types + web build) – on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The check does not need the Electron binary (the installer build downloads its own).
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  build:
    name: Types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the output
        run: |
          test -f dist/index.html
          ls dist/assets/*.wasm
