# Kontrola, že projekt jde sestavit (typy + webový build) – při každém pushi a pull requestu.
name: Kontrola

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Binárku Electronu kontrola nepotřebuje (instalátor si ji stahuje sám).
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  build:
    name: Typy a sestavení
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Kontrola výstupu
        run: |
          test -f dist/index.html
          ls dist/assets/*.wasm
